<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyberpunk 3D Hologram Heart - Three.js</title>
  <style>
    /* =========================================================
       1. CẤU TRÚC VÀ PHONG CÁCH CYBERPUNK / SCI-FI
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #020617;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #38bdf8;
      position: relative;
    }

    /* WebGL Canvas toàn màn hình */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Lớp phủ hiệu ứng quét dòng Cyberpunk Scanline & Vignette */
    .cyber-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
        radial-gradient(circle at center, transparent 50%, rgba(2, 6, 23, 0.9) 100%);
      background-size: 100% 4px, 100% 100%;
    }

    /* Giao diện người dùng Sci-fi HUD - Góc trên trái */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #00f0ff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-title::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    .hud-subtitle {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #a855f7;
      margin-top: 5px;
      opacity: 0.9;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }

    /* Telemetry Box - Góc trên phải hiển thị nhịp tim & trạng thái gió nhẹ */
    .hud-telemetry {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.35);
      padding: 8px 16px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      pointer-events: none;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
      transition: transform 0.25s ease, background-color 0.25s ease;
    }

    .pulse-dot.beating {
      transform: scale(1.35);
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    .pulse-dot.breeze {
      background: #38bdf8;
      box-shadow: 0 0 12px #00f0ff;
    }

    .telemetry-info {
      display: flex;
      flex-direction: column;
    }

    .telemetry-label {
      font-size: 9px;
      letter-spacing: 1px;
      color: rgba(224, 231, 255, 0.6);
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 13px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .telemetry-wind {
      font-size: 10px;
      color: #c084fc;
      letter-spacing: 1px;
      margin-top: 1px;
    }

    /* SVG Biểu đồ sóng điện tim ECG */
    .ecg-svg {
      width: 60px;
      height: 20px;
      stroke: #00f0ff;
      stroke-width: 1.8;
      fill: none;
      filter: drop-shadow(0 0 4px #00f0ff);
    }

    /* Bảng điều khiển nút bấm ở góc dưới */
    .hud-footer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 9px 18px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.22);
      border-color: #00f0ff;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.65);
      transform: translateY(-2px);
    }

    .hud-btn.active {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .hud-tip {
      position: absolute;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(224, 231, 255, 0.6);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>

  <!-- Import map định tuyến thư viện Three.js và Addons chính thức từ CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Lớp phủ scanline & vignette -->
  <div class="cyber-overlay"></div>

  <!-- HUD Thông tin Cyberpunk -->
  <div class="hud-header">
    <div class="hud-title">Hologram Matrix // Heart Core</div>
    <div class="hud-subtitle">Quantum Sync: 8,500 Pts &bull; Gentle Breeze &bull; 30 BPM</div>
  </div>

  <!-- Telemetry theo dõi xung nhịp và cơn gió nhẹ -->
  <div class="hud-telemetry">
    <div class="pulse-dot" id="pulse-indicator"></div>
    <div class="telemetry-info">
      <span class="telemetry-label">Trạng thái hệ thống</span>
      <span class="telemetry-val" id="bpm-val">30 BPM</span>
      <span class="telemetry-wind" id="wind-status">Gió nhẹ: Chuẩn bị...</span>
    </div>
    <svg class="ecg-svg" viewBox="0 0 60 20">
      <polyline points="0,10 18,10 22,2 26,18 30,6 34,12 38,10 60,10" />
    </svg>
  </div>

  <div class="hud-tip">[ Kéo chuột / Chạm để xoay 3D &bull; Cuộn chuột để Zoom ]</div>

  <div class="hud-footer">
    <button class="hud-btn active" id="btn-toggle-wind">Gió nhẹ: Tự động Bật</button>
    <button class="hud-btn" id="btn-trigger-wind">Thổi gió nhẹ</button>
    <button class="hud-btn" id="btn-toggle-spin">Tự xoay: Bật</button>
  </div>

  <!-- =========================================================
       2. MÃ NGUỒN THREE.JS CHI TIẾT
       ========================================================= -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    /* ---------------------------------------------------------
       A. TẠO TEXTURE PHÁT SÁNG CHO HẠT (GLOW SPRITE)
       --------------------------------------------------------- */
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.85)');
      gradient.addColorStop(0.55, 'rgba(255, 255, 255, 0.25)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const particleTexture = createGlowTexture();

    /* ---------------------------------------------------------
       B. THIẾT LẬP SCENE, CAMERA, RENDERER & POST-PROCESSING
       --------------------------------------------------------- */
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 42);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // Điều khiển camera xoay 360 độ tự do OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 80;
    controls.minDistance = 15;
    controls.target.set(0, 0, 0);

    // Thiết lập Post-processing với UnrealBloomPass - Ánh sáng dịu nhẹ, ổn định KHÔNG NHÁY
    const renderScene = new RenderPass(scene, camera);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.45, // Cường độ Bloom cố định, ổn định, dịu mắt
      0.65, // Bán kính hào quang tỏa đều
      0.15  // Ngưỡng sáng
    );

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    /* ---------------------------------------------------------
       C. BỆ PHÁT HOLOGRAM Ở ĐÁY (PEDESTAL RINGS & TORUS)
       --------------------------------------------------------- */
    const pedestalGroup = new THREE.Group();
    pedestalGroup.position.y = -17;
    scene.add(pedestalGroup);

    function createPedestalRing(radius, tubeRadius, particleCount, colorHex) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const color = new THREE.Color(colorHex);

      for (let i = 0; i < particleCount; i++) {
        const theta = (i / particleCount) * Math.PI * 2;
        const r = radius + (Math.random() - 0.5) * tubeRadius;
        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;
        const y = (Math.random() - 0.5) * tubeRadius * 0.5;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.48,
        map: particleTexture,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.82
      });

      return new THREE.Points(geometry, material);
    }

    const outerRing = createPedestalRing(18, 1.2, 800, 0x00f0ff);
    pedestalGroup.add(outerRing);

    const innerRing = createPedestalRing(12, 0.8, 500, 0xc084fc);
    pedestalGroup.add(innerRing);

    const torusGeom = new THREE.TorusGeometry(18, 0.08, 8, 80);
    torusGeom.rotateX(Math.PI / 2);
    const torusMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    const torusMesh = new THREE.Mesh(torusGeom, torusMat);
    pedestalGroup.add(torusMesh);

    /* ---------------------------------------------------------
       D. HỆ THỐNG TRÁI TIM 3D THỂ TÍCH TINH TẾ (8,500 HẠT)
       Đầy đặn ở mặt trước (+Z) và mặt sau (-Z)
       --------------------------------------------------------- */
    const HEART_COUNT = 8500;
    const heartGeometry = new THREE.BufferGeometry();
    const heartPositions = new Float32Array(HEART_COUNT * 3);
    const basePositions = new Float32Array(HEART_COUNT * 3);
    const heartColors = new Float32Array(HEART_COUNT * 3);
    const heartDistances = new Float32Array(HEART_COUNT);
    const particlePhases = new Float32Array(HEART_COUNT);

    // Hệ số đón gió riêng theo chiều cao Y (Chỉ phần dưới đón gió nhẹ, phần trên giữ nguyên)
    const lowerFactors = new Float32Array(HEART_COUNT);
    const windOffsetsX = new Float32Array(HEART_COUNT);
    const windOffsetsY = new Float32Array(HEART_COUNT);
    const windOffsetsZ = new Float32Array(HEART_COUNT);
    const windVelX = new Float32Array(HEART_COUNT);
    const windVelY = new Float32Array(HEART_COUNT);
    const windVelZ = new Float32Array(HEART_COUNT);
    const particleSensitivity = new Float32Array(HEART_COUNT);

    const colorCyan = new THREE.Color(0x00f0ff);
    const colorPurple = new THREE.Color(0xa855f7);
    const colorPink = new THREE.Color(0xf472b6);
    const colorLightBlue = new THREE.Color(0x93c5fd);

    for (let i = 0; i < HEART_COUNT; i++) {
      // 1. Tọa độ đường bao tham số trái tim 2D
      const t = Math.random() * Math.PI * 2;
      const x0 = 16 * Math.pow(Math.sin(t), 3);
      const y0 = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

      // 2. Phân bố hạt:
      // 42% mặt trước (+Z), 42% mặt sau (-Z), 16% lòng thể tích bên trong
      const particleRole = Math.random();
      let s, zSign, depthFactor;

      if (particleRole < 0.42) {
        // Mặt trước (+Z): uốn lồi tròn đầy ra phía trước
        s = 0.08 + 0.92 * Math.sqrt(Math.random());
        zSign = 1.0;
        depthFactor = 0.88 + 0.12 * Math.random();
      } else if (particleRole < 0.84) {
        // Mặt sau (-Z): uốn lồi đối xứng đầy đặn ra phía sau
        s = 0.08 + 0.92 * Math.sqrt(Math.random());
        zSign = -1.0;
        depthFactor = 0.88 + 0.12 * Math.random();
      } else {
        // Lòng thể tích kết nối 2 mặt
        s = Math.pow(Math.random(), 0.6);
        zSign = Math.random() < 0.5 ? 1.0 : -1.0;
        depthFactor = Math.pow(Math.random(), 0.55);
      }

      const x = x0 * s;
      const y = y0 * s;

      // 3. Độ dày trục Z: Nở tròn căng ở phần 2 thùy trên và thon nhọn dần về đáy
      const normalizedY = Math.max(0.01, (y + 17.0) / 29.0);
      const H = 11.2 * Math.pow(normalizedY, 0.52);

      let groove = 1.0;
      if (y > -2.0) {
        groove = 1.0 - 0.22 * Math.exp(-Math.pow(x / 3.4, 2));
      }

      const maxZ = Math.sqrt(Math.max(0.0, 1.0 - s * s)) * H * groove;

      const jitter = 0.16;
      const finalX = x + (Math.random() - 0.5) * jitter;
      const finalY = y + (Math.random() - 0.5) * jitter;
      const finalZ = (zSign * maxZ * depthFactor) + (Math.random() - 0.5) * jitter;

      heartPositions[i * 3] = finalX;
      heartPositions[i * 3 + 1] = finalY;
      heartPositions[i * 3 + 2] = finalZ;

      basePositions[i * 3] = finalX;
      basePositions[i * 3 + 1] = finalY;
      basePositions[i * 3 + 2] = finalZ;

      const dist = Math.sqrt(finalX * finalX + finalY * finalY + finalZ * finalZ);
      heartDistances[i] = dist;
      particlePhases[i] = Math.random() * Math.PI * 2;
      particleSensitivity[i] = 0.8 + Math.random() * 0.5;

      // Tính toán hệ số đón gió: CHỈ TÁC ĐỘNG VÀO PHẦN DƯỚI CỦA TRÁI TIM (y < 0)
      // Phần trên (y >= 1.0) hệ số = 0 hoàn toàn không bị lay chuyển
      // Chóp đáy nhọn (y = -17) đón gió tối đa = 1.0
      const rawLower = (-finalY + 1.0) / 18.0;
      const clampedLower = Math.max(0.0, Math.min(1.0, rawLower));
      lowerFactors[i] = Math.pow(clampedLower, 1.8);

      // Phối màu sắc Hologram 3D:
      const distRatio = dist / 16;
      const zAbsRatio = Math.abs(finalZ) / 10;
      const vertexColor = new THREE.Color();

      if (distRatio < 0.38) {
        vertexColor.copy(colorCyan).lerp(colorLightBlue, 0.35);
      } else if (distRatio < 0.75) {
        vertexColor.copy(colorCyan).lerp(colorPurple, (distRatio - 0.38) * 2.7);
      } else {
        vertexColor.copy(colorPurple).lerp(colorPink, Math.min(1.0, (distRatio - 0.75) * 2.2 + zAbsRatio * 0.3));
      }

      heartColors[i * 3] = vertexColor.r;
      heartColors[i * 3 + 1] = vertexColor.g;
      heartColors[i * 3 + 2] = vertexColor.b;
    }

    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMaterial = new THREE.PointsMaterial({
      size: 0.54,
      map: particleTexture,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.95
    });

    const heartGroup = new THREE.Group();
    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    heartGroup.add(heartMesh);
    scene.add(heartGroup);

    /* ---------------------------------------------------------
       E. LUỒNG HẠT BAY XOẮN ỐC (FLOWING STREAMS / TRAILS)
       --------------------------------------------------------- */
    const STREAM_COUNT = 900;
    const streamGeometry = new THREE.BufferGeometry();
    const streamPositions = new Float32Array(STREAM_COUNT * 3);
    const streamColors = new Float32Array(STREAM_COUNT * 3);
    const streamData = [];

    for (let i = 0; i < STREAM_COUNT; i++) {
      const startY = -17 + Math.random() * 26;
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.09 + Math.random() * 0.14;
      const spiralSpeed = 0.012 + Math.random() * 0.022;

      streamData.push({
        y: startY,
        angle: angle,
        speed: speed,
        spiralSpeed: spiralSpeed,
        baseRadius: 3 + Math.random() * 14
      });

      streamPositions[i * 3] = 0;
      streamPositions[i * 3 + 1] = startY;
      streamPositions[i * 3 + 2] = 0;

      const streamColor = Math.random() > 0.4 ? colorCyan : colorPink;
      streamColors[i * 3] = streamColor.r;
      streamColors[i * 3 + 1] = streamColor.g;
      streamColors[i * 3 + 2] = streamColor.b;
    }

    streamGeometry.setAttribute('position', new THREE.BufferAttribute(streamPositions, 3));
    streamGeometry.setAttribute('color', new THREE.BufferAttribute(streamColors, 3));

    const streamMaterial = new THREE.PointsMaterial({
      size: 0.40,
      map: particleTexture,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.75
    });

    const streamMesh = new THREE.Points(streamGeometry, streamMaterial);
    scene.add(streamMesh);

    /* ---------------------------------------------------------
       F. QUẢN LÝ QUY TRÌNH GIẢ LẬP CƠN GIÓ NHẸ TỰ ĐỘNG
       Chỉ thổi phần dưới từ PHẢI qua TRÁI rất tự nhiên & hồi tụ
       --------------------------------------------------------- */
    let autoWind = true;
    let autoSpin = true;
    let manualBreezeTriggered = false;
    let manualBreezeTimer = 0;

    const pulseIndicator = document.getElementById('pulse-indicator');
    const bpmVal = document.getElementById('bpm-val');
    const windStatusEl = document.getElementById('wind-status');
    const btnToggleWind = document.getElementById('btn-toggle-wind');
    const btnTriggerWind = document.getElementById('btn-trigger-wind');
    const btnSpin = document.getElementById('btn-toggle-spin');

    btnToggleWind.addEventListener('click', () => {
      autoWind = !autoWind;
      btnToggleWind.textContent = autoWind ? 'Gió nhẹ: Tự động Bật' : 'Gió nhẹ: Đã tắt';
      btnToggleWind.classList.toggle('active', autoWind);
    });

    btnTriggerWind.addEventListener('click', () => {
      manualBreezeTriggered = true;
      manualBreezeTimer = 0;
    });

    btnSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnSpin.textContent = autoSpin ? 'Tự xoay: Bật' : 'Tự xoay: Tắt';
      btnSpin.classList.toggle('active', autoSpin);
    });

    /* ---------------------------------------------------------
       G. VÒNG LẶP HOẠT HỌA & VẬT LÝ GIÓ NHẸ (ANIMATION LOOP)
       --------------------------------------------------------- */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      const posAttr = heartGeometry.attributes.position;
      const streamPosAttr = streamGeometry.attributes.position;

      /* =======================================================
         1. CHU KỲ CƠN GIÓ THOẢNG NHẸ TỰ NHIÊN (GENTLE BREEZE)
         Chu kỳ 9.0s: 0-3.8s Yên bình -> 3.8-6.2s Gió nhẹ lướt qua đáy -> 6.2-9.0s Trôi về
         ======================================================= */
      const BREEZE_CYCLE = 9.0;
      let breezeProgress = (elapsedTime % BREEZE_CYCLE);

      if (manualBreezeTriggered) {
        manualBreezeTimer += 0.016;
        breezeProgress = 3.8 + manualBreezeTimer;
        if (manualBreezeTimer >= 4.5) {
          manualBreezeTriggered = false;
        }
      }

      let isBreezeActive = false;
      let breezeStrength = 0;

      if (autoWind || manualBreezeTriggered) {
        if (breezeProgress >= 3.8 && breezeProgress < 6.2) {
          // Gió nhẹ đang lướt qua phần đáy tim
          isBreezeActive = true;
          const tBreeze = (breezeProgress - 3.8) / 2.4; // [0 -> 1]
          // Đường cong hình sin êm dịu, mềm mại như một làn gió thoảng
          breezeStrength = Math.sin(tBreeze * Math.PI);
          windStatusEl.textContent = 'Gió nhẹ: Lướt qua phần dưới...';
          pulseIndicator.classList.add('breeze');
        } else if (breezeProgress >= 6.2 && breezeProgress < 8.2) {
          // Gió tan dần, các hạt ở chóp đáy trôi êm ả về vị trí
          windStatusEl.textContent = 'Đáy tim: Trôi êm ả về vị trí...';
          pulseIndicator.classList.remove('breeze');
        } else {
          // Ổn định hoàn toàn
          windStatusEl.textContent = 'Gió nhẹ: Chuẩn bị...';
          pulseIndicator.classList.remove('breeze');
        }
      } else {
        windStatusEl.textContent = 'Gió: Đã tắt';
        pulseIndicator.classList.remove('breeze');
      }

      /* =======================================================
         2. TÍNH TOÁN XUNG NHỊP 30 BPM (CHU KỲ 2.0 GIÂY)
         ======================================================= */
      const beatPeriod = 2.0;
      const beatProgress = (elapsedTime % beatPeriod) / beatPeriod;
      let isBeating = false;

      if ((beatProgress < 0.28 && beatProgress > 0.05) || (beatProgress > 0.36 && beatProgress < 0.52)) {
        isBeating = true;
      }

      if (isBeating && !isBreezeActive) {
        pulseIndicator.classList.add('beating');
      } else if (!isBreezeActive) {
        pulseIndicator.classList.remove('beating');
      }

      /* =======================================================
         3. CẬP NHẬT VẬT LÝ: GIÓ NHẸ THỔI CHỈ Ở PHẦN DƯỚI
         Khí động học tự nhiên: Gió từ phải qua trái lượn uốn quanh đáy
         ======================================================= */
      // Đầu ngọn gió quét êm từ phải (+16) sang trái (-20)
      const windSweepX = 16.0 - ((breezeProgress - 3.8) / 2.4) * 36.0;

      for (let i = 0; i < HEART_COUNT; i++) {
        const idx = i * 3;
        const bx = basePositions[idx];
        const by = basePositions[idx + 1];
        const bz = basePositions[idx + 2];
        const dist = heartDistances[i];
        const phase = particlePhases[i];
        const sensitivity = particleSensitivity[i];
        const lowerFactor = lowerFactors[i]; // = 0 ở phần trên, tăng dần về 1 ở chóp đáy

        // 3.1. Tác động của cơn gió nhẹ:
        // Chỉ các hạt có lowerFactor > 0 (phần dưới tim) mới bị lay chuyển
        if (isBreezeActive && lowerFactor > 0.001) {
          const currentParticleX = bx + windOffsetsX[i];
          // Gió thổi từ phải qua trái, tác động khi ngọn gió quét qua
          if (currentParticleX > windSweepX - 4.0) {
            // Lực gió nhẹ nhàng, tinh tế (gentle breeze)
            const push = breezeStrength * lowerFactor * sensitivity * 0.16;

            // Thổi lệch êm ái sang bên trái (-X)
            windVelX[i] -= push * (1.1 + Math.sin(phase + elapsedTime * 2.8) * 0.35);

            // Dòng khí động học lượn sóng cuộn nhẹ lên trên và chiều sâu (aerodynamic curl)
            const updraft = Math.sin(elapsedTime * 3.2 + phase + bx * 0.25) * 0.45;
            windVelY[i] += updraft * push;

            const depthSway = Math.cos(elapsedTime * 2.8 + phase) * 0.5;
            windVelZ[i] += depthSway * push;
          }
        }

        // 3.2. Lực sức căng bề mặt / từ tính đưa hạt trôi êm ả về vị trí (Damped glide back)
        const returnForce = isBreezeActive ? 0.026 : 0.048;
        const airDrag = 0.89; // Ma sát không khí tự nhiên

        windVelX[i] += -windOffsetsX[i] * returnForce;
        windVelY[i] += -windOffsetsY[i] * returnForce;
        windVelZ[i] += -windOffsetsZ[i] * returnForce;

        windVelX[i] *= airDrag;
        windVelY[i] *= airDrag;
        windVelZ[i] *= airDrag;

        windOffsetsX[i] += windVelX[i];
        windOffsetsY[i] += windVelY[i];
        windOffsetsZ[i] += windVelZ[i];

        // Khóa hạt êm dịu khi ở trạng thái nghỉ
        if (!isBreezeActive) {
          windOffsetsX[i] *= 0.93;
          windOffsetsY[i] *= 0.93;
          windOffsetsZ[i] *= 0.93;
        }

        // 3.3. Nhịp đập 30 BPM lan toả mượt mà
        const waveDelay = (dist / 18.0) * 0.08;
        let localProgress = beatProgress - waveDelay;
        if (localProgress < 0) localProgress += 1.0;

        let localPulse = 0;
        if (localProgress < 0.28) {
          const p1 = localProgress / 0.28;
          localPulse = Math.sin(p1 * Math.PI) * 0.19;
        } else if (localProgress >= 0.35 && localProgress < 0.55) {
          const p2 = (localProgress - 0.35) / 0.20;
          localPulse = Math.sin(p2 * Math.PI) * 0.09;
        } else {
          const p3 = (localProgress - 0.55) / 0.45;
          localPulse = -Math.sin(p3 * Math.PI) * 0.025;
        }

        const scale = 1.0 + localPulse;

        // Chuyển động lượn bồng bềnh vi mô
        const driftX = Math.sin(elapsedTime * 1.6 + phase) * 0.14;
        const driftY = Math.cos(elapsedTime * 1.4 + phase) * 0.14;
        const driftZ = Math.sin(elapsedTime * 1.5 + phase) * 0.14;

        // Tọa độ hiển thị tổng hợp
        posAttr.array[idx] = (bx * scale + driftX) + windOffsetsX[i];
        posAttr.array[idx + 1] = (by * scale + driftY) + windOffsetsY[i];
        posAttr.array[idx + 2] = (bz * scale + driftZ) + windOffsetsZ[i];
      }
      posAttr.needsUpdate = true;

      // 4. Cập nhật luồng hạt cuộn xoắn ốc từ bệ hologram lên trái tim
      for (let i = 0; i < STREAM_COUNT; i++) {
        const idx = i * 3;
        const s = streamData[i];

        s.y += s.speed;
        s.angle += s.spiralSpeed;

        if (s.y > 14) {
          s.y = -17;
          s.angle = Math.random() * Math.PI * 2;
        }

        const progressStream = (s.y - (-17)) / (14 - (-17));
        const currentRadius = s.baseRadius * (1.0 - progressStream * 0.65);

        // Luồng hạt ở đáy cũng hơi uốn nhẹ sang trái khi gió thoảng qua
        const streamWindShift = isBreezeActive ? -breezeStrength * 1.8 : 0;

        streamPosAttr.array[idx] = Math.cos(s.angle) * currentRadius + streamWindShift;
        streamPosAttr.array[idx + 1] = s.y;
        streamPosAttr.array[idx + 2] = Math.sin(s.angle) * currentRadius;
      }
      streamPosAttr.needsUpdate = true;

      // 5. Xoay chậm bệ Hologram và hệ thống trái tim quanh trục Y
      outerRing.rotation.y += 0.005;
      innerRing.rotation.y -= 0.007;
      torusMesh.rotation.z += 0.0025;

      if (autoSpin) {
        heartGroup.rotation.y += 0.0055;
      }

      // 6. Render khung hình ổn định qua Bloom Pass
      controls.update();
      composer.render();
    }

    animate();

    /* ---------------------------------------------------------
       H. THÍCH ỨNG KÍCH THƯỚC MÀN HÌNH (RESPONSIVE)
       --------------------------------------------------------- */
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      composer.setSize(w, h);
    });
  </script>
</body>
</html>
